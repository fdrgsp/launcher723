name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS .app
        run: |
          TARGET="dist/pyrunner-mac/pyrunner.app/Contents"
          mkdir -p "$TARGET/MacOS" "$TARGET/Resources"
          cp macos/Info.plist "$TARGET/Info.plist"
          cp macos/icon.icns "$TARGET/Resources/icon.icns"

          # Compile universal binary stub (arm64 + x86_64)
          cc -arch arm64 -arch x86_64 -o "$TARGET/MacOS/launch" macos/launch.c
          chmod +x "$TARGET/MacOS/launch"

          cp macos/launch.sh "$TARGET/MacOS/launch.sh"
          chmod +x "$TARGET/MacOS/launch.sh"

          cd dist && zip -r "pyrunner-mac.zip" "pyrunner-mac/" && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: dist/*.zip

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install go-winres
        run: |
          go install github.com/tc-hib/go-winres@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prepare Windows launcher resources
        run: |
          cd windows
          go-winres make
          cd ..

      - name: Build Windows packages
        run: |
          mkdir -p dist

          # Windows amd64 (.exe)
          cd windows && GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o "../dist/pyrunner-windows-amd64/pyrunner.exe" . && cd ..
          cd dist && zip -r "pyrunner-windows-amd64.zip" "pyrunner-windows-amd64/" && cd ..

          # Windows arm64 (.exe)
          cd windows && GOOS=windows GOARCH=arm64 go build -ldflags "-s -w" -o "../dist/pyrunner-windows-arm64/pyrunner.exe" . && cd ..
          cd dist && zip -r "pyrunner-windows-arm64.zip" "pyrunner-windows-arm64/" && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.zip

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
